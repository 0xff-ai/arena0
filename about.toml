# Licenses accepted for dependencies linked into the shipped arena0 binary.
# Order matters: cargo-about chooses the first option that satisfies a crate's
# SPDX expression.
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "MPL-2.0",
    "Unlicense",
    "Zlib",
    "0BSD",
    "WTFPL",
]

targets = [
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "wasm32-unknown-unknown",
]

ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }
workarounds = ["ring", "rustls"]
