[package]
name = "cumulative-sum"
version = "0.1.0"
edition = "2024"
description = "N-party cumulative sum of random contributions, broadcast over an explicit ensemble"
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.cargo-machete]
ignored = ["arena0-sdk", "borsh", "serde"]

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
debug = ["arena0-sdk/debug"]

[dependencies]
arena0-sdk = { path = "../../crates/arena0-sdk" }
serde = { version = "1", features = ["derive"] }
borsh = { version = "1.6", features = ["derive"] }
