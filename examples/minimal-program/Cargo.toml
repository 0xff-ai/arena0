[package]
name = "arena0-minimal-program"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
# The path applies inside the arena0 checkout only. The npm package ships this
# manifest without it, as `cargo publish` would, so a copy uses the released SDK.
arena0-sdk = { version = "=0.1.0", path = "../../crates/arena0-sdk" }
borsh = { version = "1.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }

[workspace]
