# nextest configuration. Docs: https://nexte.st/docs/configuration/

[profile.default]
# Abort a test that runs longer than 60s without completing, so a hang in an
# integration test fails the run instead of stalling it.
slow-timeout = { period = "60s", terminate-after = 2 }

# The integration suites each boot several daemon/node processes; a handful can
# run at once on the 24-core raptor runner before the timing windows start to
# blow (tuned on a 2-core hosted runner with max-threads = 1). Unit tests stay
# fully parallel.
[test-groups]
integration = { max-threads = 4 }

[[profile.default.overrides]]
filter = 'kind(test)'
test-group = 'integration'

# CI runs show every failure instead of stopping at the first one.
[profile.ci]
fail-fast = false
test-threads = 2

# This recovery fixture makes 8,193 durable writes. Reserve CI capacity while
# it runs; keep its existing 120-second timeout and full recovery assertions.
[[profile.ci.overrides]]
filter = 'package(=arena0-daemon) & test(=server::tests::recovery_visits_requests_after_more_than_4096_terminal_rows)'
threads-required = "num-test-threads"
