# nextest configuration. Docs: https://nexte.st/docs/configuration/

[profile.default]
# Abort a test that runs longer than 60s without completing, so a hang in an
# integration test fails the run instead of stalling it.
slow-timeout = { period = "60s", terminate-after = 2 }

# Integration binaries and daemon library tests boot real Hosts with SQLite,
# transports, and worker threads. Share their concurrency budget: kind(test)
# alone excludes the MCP and Host-open tests compiled into the library binary.
# Other library tests remain fully parallel; operation deadlines stay unchanged.
[test-groups]
integration = { max-threads = 4 }

[[profile.default.overrides]]
filter = 'kind(test) | package(arena0-daemon)'
test-group = 'integration'

# CI runs show every failure instead of stopping at the first one.
[profile.ci]
fail-fast = false
test-threads = 2
