[package]
name = "arena0-api"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared wire types for the arena0 daemon's local socket: requests, responses, and length-prefixed JSON framing"
publish.workspace = true

[dependencies]
arena0-crypto = { path = "../arena0-crypto" }
arena0-program = { path = "../arena0-program" }
arena0-protocol = { path = "../arena0-protocol" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# Length-prefixed framing over an async socket (daemon + clients enable `io`;
# pure type consumers do not pull tokio).
tokio = { workspace = true, optional = true }

[features]
default = []
io = ["dep:tokio"]

[lints]
workspace = true
